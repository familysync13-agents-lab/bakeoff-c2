; The preview is served by PHP's built-in web server (CLI SAPI): enable OPcache for it.
opcache.enable_cli = 1
memory_limit = 512M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Keep function arguments out of exception traces (and so out of error-monitoring events).
zend.exception_ignore_args = On
